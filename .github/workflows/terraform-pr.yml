name: Terraform PR
on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/**"]
    branches: [main]

# Learner Lab : pas de federation OIDC (IAM verrouille). Identifiants de session du lab
# en secrets du depot, a mettre a jour a chaque Start Lab (validite 4 h).
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tfstate-dev

jobs:
  plan-dev:
    runs-on: ubuntu-26.04
    # terraform.tfvars n'est pas versionne : les variables viennent du depot (voir README)
    env:
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_environment: dev
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cle publique SSH (lue par aws_key_pair)
        env:
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: mkdir -p ~/.ssh && printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/novasphere.pub

      - name: Display public key
        run: stat ~/.ssh/novasphere.pub

      - uses: aws-actions/configure-aws-credentials@ee295af739c0219fda4e9706cccc4b84b96887ce
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba
        with:
          terraform_version: "1.17.1"

      - run: terraform fmt -check -recursive
        working-directory: .

      - run: terraform init -input=false

      - run: terraform validate

      - uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa
        with:
          output_format: cli,json
          output_file_path: console,checkov.json
          # Possibilité d'ajouter une propriété skip pour lister les vérifications a passer

      - name: Terraform plan
        id: plan
        shell: bash # active -o pipefail : un plan en echec fait echouer l'etape
        run: terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Commenter la PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/dev/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### Terraform plan (dev)\n```\n" + plan + "\n```"
            });

      - name: Statut du plan
        if: steps.plan.outcome == 'failure'
        run: exit 1