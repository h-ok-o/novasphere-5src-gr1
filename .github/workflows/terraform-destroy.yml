name: Terraform Destroy
on:
  push:
    branches: [main]
    paths: ["envs/**", "modules/**", ".github/workflows/**"]
  # Pas de cron nocturne : a 3 h, les identifiants du lab ont expire.
  # La detection de derive se lance a la main (workflow_dispatch) pendant une session.
  workflow_dispatch:  

jobs:
  destroy:
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: true   # une derive sur dev ne doit pas annuler le controle de prod
      matrix:
        env: [dev, prod]
    # terraform.tfvars n'est pas versionne : les variables viennent du depot (voir README).
    # Une variable TF_VAR_ que la racine ne declare pas est ignoree (db_password en prod, admin_cidr en dev).
    env:
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_instance_type: ${{ matrix.env == 'prod' && 't3.small' || 't3.micro' }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
      TF_VAR_generate_inventory: "false"
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Cle publique SSH (lue par aws_key_pair)
        env:
          SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        run: mkdir -p ~/.ssh && printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/novasphere.pub
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false   # sinon le wrapper renvoie 0 pour le code 2 de -detailed-exitcode
      - run: terraform init -input=false
      - run: terraform plan -destroy -no-color -input=false -out=tfplan
      - run: terraform apply -destroy -no-color -input=false tfplan